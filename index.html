<!doctype html>

<head>
    <meta charset="UTF-8" />

            href="https://appflowy.com"
    />
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >
    <script id="appflowy-theme-init">
      // Apply the theme before the first paint. The app sets it only once its
      // code has loaded (useAppThemeMode), so until then a server-rendered
      // page would show in the light theme and flip to dark. Mirrors
      // useAppThemeMode; src/components/main/__tests__/themeInitScript.test.ts
      // keeps the two in step.
      (function () {
        try {
          var search = window.location.search;
          var fixed = search.indexOf('theme') > -1 ? new URLSearchParams(search).get('theme') : null;
          var dark;

          if (fixed === 'dark') {
            dark = true;
          } else if (fixed === 'light') {
            dark = false;
          } else {
            var stored = window.localStorage.getItem('dark-mode');

            dark = stored === null && !fixed
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
              : stored === 'true';
          }

          document.documentElement.setAttribute('data-dark-mode', dark ? 'true' : 'false');
        } catch (e) {
          // Storage or media queries unavailable: the app applies the theme on mount.
        }
      })();
    </script>
    <title>AppFlowy</title>
    <meta
            name="description"
            content="AppFlowy is an AI collaborative workspace where you achieve more without losing control of your data"
    />
    <meta

<body id="body">
<div id="root"></div>
<script
        type="module"
        src="/src/main.tsx"
></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const userAgent = window.navigator.userAgent.toLowerCase();
    const body = document.body;
    const isWin = userAgent.indexOf('win') > -1;
    const isMac = userAgent.indexOf('mac') > -1;
    const isLinux = userAgent.indexOf('linux') > -1;
    const isFirefox = userAgent.indexOf('firefox') > -1;
    const isChrome = userAgent.indexOf('chrome') > -1;
    const isSafari = userAgent.indexOf('safari') > -1;
    if (isWin) {
      body.setAttribute('data-os', 'windows');
    } else if (isMac) {
      body.setAttribute('data-os', 'mac');
    } else if (isLinux) {
      body.setAttribute('data-os', 'linux');
    } else {
      body.setAttribute('data-os', 'unknown');
    }

    if (isFirefox) {
      body.setAttribute('data-browser', 'firefox');
    } else if (isChrome) {
      body.setAttribute('data-browser', 'chrome');
    } else if (isSafari) {
      body.setAttribute('data-browser', 'safari');
    } else {
      body.setAttribute('data-browser', 'unknown');
    }
  });
</script>


</body>
</html>
