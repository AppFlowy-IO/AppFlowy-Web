worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Basic optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # GZIP compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    server {
        listen 80;

        root /usr/share/nginx/html;
        index index.html;

        # Static files cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # SPA routing
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # MCP consent and setup pages (/oauth/mcp/*) grant AI apps access to a
        # workspace, so no other site may frame them (clickjacking, RFC 9700
        # section 4.16). `rewrite ... break` serves the SPA shell from this
        # location; a try_files fallback would jump to `location /` and drop
        # these headers. The trailing slash keeps publish namespaces such as
        # /oauthors/... out. Keep in step with FRAME_DENY_PATHS in deploy/.
        location ^~ /oauth/ {
            rewrite ^ /index.html break;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }

        # Deny access to non public path
        location ~ /\. {
            deny all;
        }
    }
}