version: '3.8'

services:
  appflowy-web:
    image: appflowy/appflowy_web:latest
    ports:
      - "80:80"
    environment:
      # REQUIRED: Configure these to match your AppFlowy backend URLs
      # The container will fail to start if these are not set
      - APPFLOWY_BASE_URL=https://your-backend.example.com
      - APPFLOWY_GOTRUE_BASE_URL=https://your-backend.example.com/gotrue
      - APPFLOWY_WS_BASE_URL=wss://your-backend.example.com/ws/v2
      # OPTIONAL override: public origin of the AppFlowy MCP service (without /mcp). Without it
      # the Web uses the mcp_url AppFlowy Cloud advertises in /api/server-info, which Cloud leaves
      # out while AI apps are turned off; set it to keep Settings → MCP (the turned-off notice
      # and disconnecting) then. The bundled deployments serve MCP on the backend's own domain.
      # Keep it equal to AppFlowy Cloud's APPFLOWY_MCP_BASE_URL: it wins over server-info, and
      # the browser console warns when Cloud advertises a different origin. See doc/MCP.md.
      # - APPFLOWY_MCP_BASE_URL=https://your-backend.example.com
      # OPTIONAL: server-render published pages in these namespaces for crawlers.
      # Off by default; see doc/PUBLISH_SSR.md before enabling.
      # - APPFLOWY_INDEXABLE_NAMESPACES=docs,guide
      # - APPFLOWY_SSR_KILL_SWITCH=true
    restart: unless-stopped